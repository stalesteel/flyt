<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rediger sjekklister – Flyt</title>
<link rel="stylesheet" href="../../auth.css">
<script src="../../auth.js"></script>
<script src="../sjekkliste-data.js"></script>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1c1c1c;
    --text-muted: #6b6b6b;
    --border: #e2e2e0;
    --accent: #2f6f4f;
    --error: #b3261e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  [hidden] { display: none !important; }

  main { max-width: 720px; margin: 0 auto; }

  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .intro { margin: 0 0 20px; color: var(--text-muted); font-size: 0.92rem; line-height: 1.5; }

  #melding {
    margin: 0 0 18px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  #melding.jobber { background: #eef3f7; border-left: 4px solid #4a7fa5; }
  #melding.ok { background: #eef7f1; border-left: 4px solid var(--accent); }
  #melding.feil { background: #fdeceb; border-left: 4px solid var(--error); }

  .verktoylinje { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }

  button { font-family: inherit; font-size: 0.92rem; cursor: pointer; }

  .knapp {
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    font-weight: 600;
    color: var(--text);
  }
  .knapp.primar { background: var(--accent); border-color: var(--accent); color: #fff; }
  .knapp.fare { color: var(--error); }
  .knapp:active { opacity: 0.75; }
  .knapp:disabled { opacity: 0.5; cursor: default; }

  .liste-kort {
    margin-bottom: 20px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
  }

  .liste-topp {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .liste-topp input {
    flex: 1;
    min-width: 160px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
  }

  .punkt {
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
  }
  .punkt-topp { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .punkt-nr {
    flex-shrink: 0;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--border);
    font-size: 0.8rem;
    font-weight: 700;
  }
  .punkt-topp .flex { flex: 1; }
  .ikonknapp {
    width: 38px; height: 38px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    font-size: 1.05rem;
    line-height: 1;
  }
  .ikonknapp:disabled { opacity: 0.35; cursor: default; }

  .punkt label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .punkt input[type="text"], .punkt textarea {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 9px;
    font-family: inherit;
    font-size: 0.95rem;
    background: var(--surface);
    color: var(--text);
  }
  .punkt textarea { min-height: 64px; resize: vertical; }

  .bilde-rad { display: flex; gap: 12px; align-items: flex-start; }
  .bilde-rad .felt { flex: 1; min-width: 0; }
  .forhandsvis {
    width: 78px;
    height: 104px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    object-fit: cover;
    object-position: center top;
    background: linear-gradient(160deg, #3a4048, #23262b);
  }

  #forhandsvisning {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #23262b;
  }
  #forhandsvisning img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  #forhandsvisning .baand {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 90px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.75) 45%, rgba(0,0,0,0) 100%);
    color: #fff;
  }
  #forhandsvisning h2 { margin: 0 0 6px; font-size: 1.45rem; }
  #forhandsvisning p { margin: 0; font-size: 1.05rem; line-height: 1.45; color: rgba(255,255,255,0.88); }
  #forhandsvisning .lukk {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 14px;
    width: 44px; height: 44px;
    border: none; border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: #fff; font-size: 1.3rem;
  }
</style>
</head>
<body>

<main>
  <h1>Rediger sjekklister</h1>
  <p class="intro">
    Endringer lagres med én gang, og er synlige på <code>/sjekkliste</code> umiddelbart.
  </p>

  <p id="melding" hidden></p>

  <div class="verktoylinje">
    <button type="button" class="knapp" id="ny-liste">Ny sjekkliste</button>
    <button type="button" class="knapp" id="oppdater">Hent på nytt</button>
  </div>

  <div id="lister"></div>
</main>

<div id="forhandsvisning" hidden>
  <img id="fv-bilde" alt="">
  <div class="baand">
    <h2 id="fv-tittel"></h2>
    <p id="fv-tekst"></p>
  </div>
  <button type="button" class="lukk" id="fv-lukk">✕</button>
</div>

<script>
FlytAuth.krevAdgang(function () {
  "use strict";

  const listerEl = document.getElementById("lister");
  const melding = document.getElementById("melding");
  const forhandsvisning = document.getElementById("forhandsvisning");
  const fvBilde = document.getElementById("fv-bilde");
  const fvTittel = document.getElementById("fv-tittel");
  const fvTekst = document.getElementById("fv-tekst");

  const MAKS_BILDESIDE = 1400;
  const BILDEKVALITET = 0.8;

  let lister = [];

  function visMelding(tekst, type) {
    melding.textContent = tekst;
    melding.className = type || "";
    melding.hidden = !tekst;
  }

  // Alle skriveoperasjoner går gjennom denne, så feil aldri blir tause
  function utfor(tekst, arbeid) {
    visMelding(tekst, "jobber");
    return arbeid()
      .then(function () { return last(); })
      .then(function () { visMelding("Lagret.", "ok"); })
      .catch(function (err) {
        console.error(err);
        visMelding("Klarte ikke å lagre: " + err.message, "feil");
      });
  }

  function last() {
    return Sjekkliste.hentLister().then(function (data) {
      lister = data.lister;
      tegn();
    });
  }

  last().catch(function (err) {
    console.error(err);
    visMelding(
      "Klarte ikke å hente sjekklistene. Sjekk at tabellen SjekklisteFlyt finnes i ArcGIS " +
      "og at den tillater spørring. " + err.message, "feil");
  });

  function nyId(prefiks) {
    return prefiks + "-" + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
  }

  // ---------------- Tegning ----------------
  function tegn() {
    listerEl.innerHTML = "";

    if (!lister.length) {
      const tom = document.createElement("p");
      tom.className = "intro";
      tom.textContent = "Ingen sjekklister ennå. Trykk «Ny sjekkliste» for å lage en.";
      listerEl.appendChild(tom);
      return;
    }

    lister.forEach(function (liste) { listerEl.appendChild(tegnListe(liste)); });
  }

  function tegnListe(liste) {
    const kort = document.createElement("div");
    kort.className = "liste-kort";

    const topp = document.createElement("div");
    topp.className = "liste-topp";

    const navn = document.createElement("input");
    navn.type = "text";
    navn.value = liste.navn || "";
    navn.setAttribute("aria-label", "Navn på sjekkliste");

    // Navnet ligger på hver rad, så et nytt navn må skrives til alle punktene
    navn.addEventListener("change", function () {
      const nyttNavn = navn.value.trim();
      if (!nyttNavn || nyttNavn === liste.navn) return;
      utfor("Endrer navn…", function () {
        return Sjekkliste.endrePunkter(liste.punkter.map(function (p) {
          return { objectId: p.objectId, listeNavn: nyttNavn };
        }));
      });
    });
    topp.appendChild(navn);

    const slett = document.createElement("button");
    slett.type = "button";
    slett.className = "knapp fare";
    slett.textContent = "Slett liste";
    slett.addEventListener("click", function () {
      if (!confirm("Slette sjekklisten «" + liste.navn + "» med alle punktene?")) return;
      utfor("Sletter…", function () {
        return Sjekkliste.slettPunkter(liste.punkter.map(function (p) { return p.objectId; }));
      });
    });
    topp.appendChild(slett);

    kort.appendChild(topp);

    liste.punkter.forEach(function (punkt, i) {
      kort.appendChild(tegnPunkt(liste, punkt, i));
    });

    const nyttPunkt = document.createElement("button");
    nyttPunkt.type = "button";
    nyttPunkt.className = "knapp";
    nyttPunkt.textContent = "Legg til punkt";
    nyttPunkt.addEventListener("click", function () {
      utfor("Legger til…", function () {
        return Sjekkliste.nyttPunkt({
          listeId: liste.id,
          listeNavn: liste.navn,
          tittel: "Nytt punkt",
          beskrivelse: "",
          rekkefolge: liste.punkter.length + 1
        });
      });
    });
    kort.appendChild(nyttPunkt);

    return kort;
  }

  function tegnPunkt(liste, punkt, i) {
    const rad = document.createElement("div");
    rad.className = "punkt";

    const topp = document.createElement("div");
    topp.className = "punkt-topp";

    const nr = document.createElement("span");
    nr.className = "punkt-nr";
    nr.textContent = String(i + 1);
    topp.appendChild(nr);

    const flex = document.createElement("span");
    flex.className = "flex";
    topp.appendChild(flex);

    // Opp og ned i stedet for dra og slipp: mer treffsikkert på mobil
    const opp = document.createElement("button");
    opp.type = "button";
    opp.className = "ikonknapp";
    opp.textContent = "↑";
    opp.setAttribute("aria-label", "Flytt opp");
    opp.disabled = i === 0;
    opp.addEventListener("click", function () { flytt(liste, i, -1); });
    topp.appendChild(opp);

    const ned = document.createElement("button");
    ned.type = "button";
    ned.className = "ikonknapp";
    ned.textContent = "↓";
    ned.setAttribute("aria-label", "Flytt ned");
    ned.disabled = i === liste.punkter.length - 1;
    ned.addEventListener("click", function () { flytt(liste, i, 1); });
    topp.appendChild(ned);

    const slett = document.createElement("button");
    slett.type = "button";
    slett.className = "ikonknapp";
    slett.textContent = "✕";
    slett.setAttribute("aria-label", "Slett punkt");
    slett.addEventListener("click", function () {
      if (!confirm("Slette punktet «" + (punkt.tittel || "uten tittel") + "»?")) return;
      utfor("Sletter…", function () { return Sjekkliste.slettPunkter([punkt.objectId]); });
    });
    topp.appendChild(slett);

    rad.appendChild(topp);

    rad.appendChild(lagFelt("Tittel", "text", punkt.tittel, function (v) {
      if (v === punkt.tittel) return;
      utfor("Lagrer…", function () {
        return Sjekkliste.endrePunkter([{ objectId: punkt.objectId, tittel: v }]);
      });
    }));

    rad.appendChild(lagFelt("Beskrivelse", "textarea", punkt.beskrivelse, function (v) {
      if (v === punkt.beskrivelse) return;
      utfor("Lagrer…", function () {
        return Sjekkliste.endrePunkter([{ objectId: punkt.objectId, beskrivelse: v }]);
      });
    }));

    rad.appendChild(tegnBilde(punkt));
    return rad;
  }

  // Lagrer på change, ikke på hvert tastetrykk, så det ikke blir ett kall per bokstav
  function lagFelt(etikett, type, verdi, onChange) {
    const wrap = document.createElement("div");

    const label = document.createElement("label");
    label.textContent = etikett;
    wrap.appendChild(label);

    const felt = document.createElement(type === "textarea" ? "textarea" : "input");
    if (type !== "textarea") felt.type = "text";
    felt.value = verdi || "";
    felt.addEventListener("change", function () { onChange(felt.value.trim()); });
    wrap.appendChild(felt);

    return wrap;
  }

  function tegnBilde(punkt) {
    const rad = document.createElement("div");
    rad.className = "bilde-rad";

    const felt = document.createElement("div");
    felt.className = "felt";

    const label = document.createElement("label");
    label.textContent = punkt.bilde ? "Bilde" : "Ingen bilde";
    felt.appendChild(label);

    const velg = document.createElement("button");
    velg.type = "button";
    velg.className = "knapp";
    velg.textContent = punkt.bilde ? "Bytt bilde" : "Legg til bilde";

    const fullskjerm = document.createElement("button");
    fullskjerm.type = "button";
    fullskjerm.className = "knapp";
    fullskjerm.textContent = "Se i fullskjerm";

    // capture mangler med vilje, så man kan velge både kamera og bildebibliotek
    const filvelger = document.createElement("input");
    filvelger.type = "file";
    filvelger.accept = "image/*";
    filvelger.hidden = true;

    const miniatyr = document.createElement("img");
    miniatyr.className = "forhandsvis";
    miniatyr.alt = "";
    if (punkt.bilde) miniatyr.src = punkt.bilde;

    velg.addEventListener("click", function () { filvelger.click(); });

    filvelger.addEventListener("change", function () {
      const fil = filvelger.files && filvelger.files[0];
      if (!fil) return;
      utfor("Laster opp bilde…", function () {
        return Sjekkliste.komprimerBilde(fil, MAKS_BILDESIDE, BILDEKVALITET)
          .then(function (blob) {
            return Sjekkliste.lagreBilde(punkt.objectId, blob, punkt.attachmentId);
          });
      });
    });

    fullskjerm.addEventListener("click", function () {
      fvTittel.textContent = punkt.tittel || "";
      fvTekst.textContent = punkt.beskrivelse || "";
      if (punkt.bilde) fvBilde.src = punkt.bilde;
      else fvBilde.removeAttribute("src");
      forhandsvisning.hidden = false;
    });

    felt.appendChild(velg);
    felt.appendChild(document.createTextNode(" "));
    felt.appendChild(fullskjerm);
    felt.appendChild(filvelger);

    rad.appendChild(felt);
    rad.appendChild(miniatyr);
    return rad;
  }

  function flytt(liste, fra, retning) {
    const til = fra + retning;
    if (til < 0 || til >= liste.punkter.length) return;

    const rekkefolge = liste.punkter.slice();
    const flyttet = rekkefolge.splice(fra, 1)[0];
    rekkefolge.splice(til, 0, flyttet);

    utfor("Endrer rekkefølge…", function () {
      return Sjekkliste.endrePunkter(rekkefolge.map(function (p, i) {
        return { objectId: p.objectId, rekkefolge: i + 1 };
      }));
    });
  }

  // ---------------- Verktøylinje ----------------
  // En liste finnes bare så lenge den har punkter, siden navnet ligger på radene
  document.getElementById("ny-liste").addEventListener("click", function () {
    const navn = prompt("Navn på den nye sjekklisten:");
    if (!navn || !navn.trim()) return;
    utfor("Oppretter…", function () {
      return Sjekkliste.nyttPunkt({
        listeId: nyId("liste"),
        listeNavn: navn.trim(),
        tittel: "Nytt punkt",
        beskrivelse: "",
        rekkefolge: 1
      });
    });
  });

  document.getElementById("oppdater").addEventListener("click", function () {
    visMelding("Henter…", "jobber");
    last().then(function () { visMelding("", ""); })
      .catch(function (err) { visMelding("Klarte ikke å hente: " + err.message, "feil"); });
  });

  document.getElementById("fv-lukk").addEventListener("click", function () {
    forhandsvisning.hidden = true;
  });
});
</script>
</body>
</html>
